<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150"
     role="img" aria-label="Papers">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1A1428"/>
    </linearGradient>
    <pattern id="dotsp" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1B2432"/>
    </pattern>
    <filter id="glowp" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipp"><rect width="480" height="150" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#clipp)">
    <rect width="480" height="150" fill="url(#bgp)"/>
    <rect width="480" height="150" fill="url(#dotsp)"/>
    <rect x="0" y="0" width="4" height="150" fill="#D2A8FF"/>

    <g opacity="0.4" filter="url(#glowp)">
      <path d="M305 118 C 340 100, 360 62, 400 48 S 445 34, 460 30" fill="none" stroke="#58A6FF" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="230" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="230;0;0;230" dur="5s" repeatCount="indefinite"/></path><circle cx="305" cy="118" r="3" fill="#7EE787"/><circle cx="360" cy="62" r="3" fill="#7EE787"/><circle cx="400" cy="48" r="3" fill="#7EE787"/><circle cx="460" cy="30" r="3" fill="#7EE787"/><line x1="298" y1="125" x2="470" y2="125" stroke="#30363D" stroke-width="1"/>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="30" y="44" fill="#D2A8FF" font-size="11" font-weight="600" letter-spacing="2.6"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03 / PAPERS</text>
      <text x="30" y="78" fill="#E6EDF3" font-size="24" font-weight="650">Papers</text>
      <text x="30" y="104" fill="#8B949E" font-size="13">Working papers, preprints and referee work.</text>
      <text x="30" y="123" fill="#6E7681" font-size="12.5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">quantitative finance · empirical corporate</text>
    </g>

    <g transform="translate(444, 75)">
      <path d="M-5 -7 L4 0 L-5 7" fill="none" stroke="#D2A8FF" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 4 0; 0 0" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect width="480" height="150" rx="12" fill="none" stroke="#1F2A3A" stroke-width="1.5"/>
  </g>
</svg>
