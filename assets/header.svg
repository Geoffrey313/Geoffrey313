<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250"
     role="img" aria-label="Geoffrey Ducournau, PhD — Quantitative Research and AI Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="55%"  stop-color="#0F1626"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB"/>
      <stop offset="55%"  stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7EE787"/>
    </linearGradient>

    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0D1117" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#0D1117" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 L0 40" fill="none" stroke="#1A2333" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="rounded"><rect width="1000" height="250" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <rect width="1000" height="250" fill="url(#grid)" opacity="0.75"/>

    <!-- price series -->
    <path fill="url(#area)"
          d="M0 200 L60 190 L120 206 L180 168 L240 182 L300 148 L360 161 L420 126 L480 139
             L540 108 L600 121 L660 94 L720 103 L780 76 L840 87 L900 60 L1000 48 L1000 250 L0 250 Z"/>
    <path fill="none" stroke="url(#stroke)" stroke-width="2.4" stroke-linejoin="round"
          stroke-linecap="round" filter="url(#glow)" stroke-dasharray="1250" stroke-dashoffset="0"
          d="M0 200 L60 190 L120 206 L180 168 L240 182 L300 148 L360 161 L420 126 L480 139
             L540 108 L600 121 L660 94 L720 103 L780 76 L840 87 L900 60 L1000 48">
      <animate attributeName="stroke-dashoffset" from="1250" to="0" dur="3.2s"
               begin="0s" fill="freeze"/>
    </path>

    <!-- pulsing last tick -->
    <circle cx="900" cy="60" r="4" fill="#7EE787" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.0s" fill="freeze"/>
      <animate attributeName="r" values="4;8;4" dur="2.2s" begin="3.4s" repeatCount="indefinite"/>
    </circle>

    <rect width="1000" height="250" fill="url(#scrim)"/>

    <!-- text block -->
    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="56" y="98" fill="#E6EDF3" font-size="46" font-weight="700" letter-spacing="1.5">
        Geoffrey Ducournau<tspan font-size="25" font-weight="400" fill="#8B949E"
          letter-spacing="1" dx="6">, PhD</tspan>
      </text>
      <text x="58" y="132" fill="#58A6FF" font-size="18" font-weight="500" letter-spacing="3.2">
        QUANTITATIVE RESEARCH · AI ARCHITECTURE
      </text>
      <rect x="58" y="150" width="54" height="2" rx="1" fill="#1F6FEB"/>
      <text x="58" y="184" fill="#8B949E" font-size="14.5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        R&amp;D &amp; AI Architect · Paris / Tianjin
      </text>
      <text x="58" y="207" fill="#6E7681" font-size="13.5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        complex systems · microstructure · asset pricing<tspan fill="#7EE787" dx="6">&#9608;<animate
          attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
      </text>
    </g>

    <rect width="1000" height="250" rx="14" fill="none" stroke="#1F2A3A" stroke-width="1.5"/>
  </g>
</svg>
