<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12"
     role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#1F6FEB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#7EE787" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect x="0" y="5" width="1000" height="2" fill="url(#base)"/>

  <g filter="url(#soft)">
    <rect y="4" width="260" height="4" fill="url(#pulse)">
      <animate attributeName="x" from="-260" to="1000" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cy="6" r="2.5" fill="#7EE787">
    <animate attributeName="cx" from="-10" to="1010" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
