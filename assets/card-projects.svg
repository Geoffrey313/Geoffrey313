<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150"
     role="img" aria-label="Projects">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161226"/>
    </linearGradient>
    <pattern id="dotsp" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#241B32"/>
    </pattern>
    <filter id="glowp" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipp"><rect width="480" height="150" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#clipp)">
    <rect width="480" height="150" fill="url(#bgp)"/>
    <rect width="480" height="150" fill="url(#dotsp)"/>
    <rect x="0" y="0" width="4" height="150" fill="#D2A8FF"/>

    <g opacity="0.55" filter="url(#glowp)">
      <rect x="352" y="34" width="88" height="58" rx="8" fill="#0D1117" stroke="#58A6FF" stroke-width="1.4" opacity="0.55"/>
      <rect x="340" y="46" width="88" height="58" rx="8" fill="#0D1117" stroke="#7EE787" stroke-width="1.4" opacity="0.7"/>
      <rect x="328" y="58" width="88" height="58" rx="8" fill="#12101E" stroke="#D2A8FF" stroke-width="1.6"/>
      <line x1="340" y1="76" x2="404" y2="76" stroke="#D2A8FF" stroke-width="1.4" opacity="0.8"/>
      <line x1="340" y1="88" x2="392" y2="88" stroke="#8B949E" stroke-width="1.2" opacity="0.6"/>
      <circle cx="330" cy="58" r="3.5" fill="#D2A8FF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="30" y="44" fill="#D2A8FF" font-size="11" font-weight="600" letter-spacing="2.6"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04 / PROJECTS</text>
      <text x="30" y="78" fill="#E6EDF3" font-size="24" font-weight="650">Projects</text>
      <text x="30" y="104" fill="#8B949E" font-size="13">Delivered systems, anonymised by sector.</text>
      <text x="30" y="123" fill="#6E7681" font-size="12.5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">context · problem · solution · impact</text>
    </g>

    <g transform="translate(444, 75)">
      <path d="M-5 -7 L4 0 L-5 7" fill="none" stroke="#D2A8FF" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 4 0; 0 0" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect width="480" height="150" rx="12" fill="none" stroke="#1F2A3A" stroke-width="1.5"/>
  </g>
</svg>
